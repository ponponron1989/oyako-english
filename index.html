<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おやこ English 🍎</title><style>body{margin:0;background:#fff8ef;color:#26382f;font-family:system-ui,-apple-system,sans-serif}.app{max-width:480px;margin:auto;padding:22px}h1{font-size:25px;margin:8px 0}.sub{color:#66776d}.card{background:white;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #594c3214}.apples{text-align:center;font-size:42px;line-height:1.6}.tag{font-size:13px;color:#62796b;font-weight:700}.english{font-size:26px;font-weight:750;margin:10px 0}.japanese{font-size:15px;color:#68766c}.btn{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#237d5b;color:white}.outline{background:#e6f3e9;color:#1f6c4d}.row{display:flex;gap:10px}.row>*{flex:1}.hide{display:none}.progress{height:8px;border-radius:10px;background:#e3e9df;overflow:hidden}.bar{height:100%;background:#58a57c;transition:width .2s}.note{font-size:13px;color:#6b756f;line-height:1.6}select{padding:10px;border:1px solid #cad8cb;border-radius:12px;background:white;font-size:15px;width:100%}button:disabled{opacity:.4}label{display:flex;gap:8px;align-items:center}</style></head><body><main class="app"><h1>🍎 おやこ English</h1><div class="sub">親が聞いて、子どもが答える英会話</div><div class="card"><div class="tag">テーマをえらぼう</div><select id="theme"><option value="apples">🍎 りんごを数えよう</option><option value="breakfast">🍞 朝ごはん</option></select><p class="tag" id="progressText"></p><div class="progress"><div class="bar" id="bar"></div></div><div class="apples" id="picture">🍎🍎🍎🍎🍎</div><div class="card" style="background:#f5faf6;box-shadow:none"><div class="tag">👩 親が話す英語</div><div class="english" id="question"></div><div class="japanese" id="questionJa"></div><p><button class="btn outline" id="speakQ">🔊 質問を聞く</button></p></div><div id="answerBox" class="card hide" style="background:#fff7e8;box-shadow:none"><div class="tag">🧒 子どものお返事</div><div class="english" id="answer"></div><div class="japanese" id="answerJa"></div><p><button class="btn outline" id="speakA">🔊 答えを聞く</button></p></div><button class="btn" id="reveal" style="width:100%">こたえを見る</button><p><label><input type="checkbox" id="hint" checked> 日本語のカンペを表示</label></p><div class="row"><button class="btn outline" id="prev">← もどる</button><button class="btn" id="next">つぎへ →</button></div></div><p class="note">音声は端末の読み上げ機能を使います。iPhoneではSafariで開き、ボタンをタップしてください。端末によって声や発音が異なります。音が出ない場合は音量・消音設定を確認してください。</p></main><script>const data={apples:[['How many apples?','りんごはいくつ？','Five!','5こ！'],['What color are the apples?','りんごは何色？','Red!','赤！'],['Do you like apples?','りんごは好き？','Yes, I do!','うん、好き！'],['How many red apples are there?','赤いりんごはいくつある？','There are five red apples.','赤いりんごが5こあるよ。'],['Why do you like apples?','どうしてりんごが好きなの？','Because they are sweet!','甘いから！']],breakfast:[['Are you hungry?','おなかすいた？','Yes!','うん！'],['Do you want some bread?','パンを食べたい？','Yes, please.','うん、お願い。'],['What would you like to drink?','何を飲みたい？','Milk, please.','牛乳をお願い。'],['Is it yummy?','おいしい？','It is yummy!','おいしい！'],['What did you have for breakfast?','朝ごはんは何を食べた？','I had bread and milk.','パンと牛乳を食べたり飲んだりしたよ。']]};let index=0,shown=false;const el=id=>document.getElementById(id);function render(){const theme=el('theme').value,d=data[theme][index];el('picture').textContent=theme==='apples'?'🍎🍎🍎🍎🍎':'🍞🥛🍌';['question','questionJa','answer','answerJa'].forEach((k,i)=>el(k).textContent=d[i]);el('progressText').textContent=`レベル ${index+1} / ${data[theme].length}`;el('bar').style.width=`${(index+1)/data[theme].length*100}%`;el('answerBox').classList.toggle('hide',!shown);el('reveal').classList.toggle('hide',shown);el('prev').disabled=index===0;el('next').textContent=index===data[theme].length-1?'もう一度 ↻':'つぎへ →';el('questionJa').classList.toggle('hide',!el('hint').checked);el('answerJa').classList.toggle('hide',!el('hint').checked)}function speak(text){if(!('speechSynthesis'in window)){alert('このブラウザでは音声読み上げが使えません');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}el('speakQ').onclick=()=>speak(el('question').textContent);el('speakA').onclick=()=>speak(el('answer').textContent);el('reveal').onclick=()=>{shown=true;render()};el('hint').onchange=render;el('theme').onchange=()=>{index=0;shown=false;render()};el('prev').onclick=()=>{index=Math.max(0,index-1);shown=false;render()};el('next').onclick=()=>{index=(index+1)%data[el('theme').value].length;shown=false;render()};render();</script></body></html>
